on:
  workflow_call:
    inputs:
      package_folder:
        required: true
        type: string
      test_args:
        required: false
        type: string
        default: ""

jobs:
  forge_test:
    strategy:
      fail-fast: true

    name: Forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install node deps and foundry
        uses: ./.github/actions/setup_deps

      - name: Load foundry cache
        uses: ./.github/actions/cache_foundry_build
        with:
          package_folder: ${{ inputs.package_folder }}

      - name: Test Light
        run: |
          cd ${{ inputs.package_folder}} && pnpm clean && pnpm test:ci ${{ inputs.test_args }}

      - name: Test
        if: github.ref == 'refs/heads/main'
        run: |
          cd ${{ inputs.package_folder}} && pnpm clean && pnpm test ${{ inputs.test_args }}

      - name: Run Geiger Check
        run: |
          forge geiger --check ${{ inputs.package_folder }}/src*
        id: geiger
