on:
  workflow_call:
    inputs:
      package_folder:
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install node deps and foundry
        uses: ./.github/actions/setup_deps

      - name: Install Slither
        run: python3 -m pip install slither-analyzer==0.11.5

      - name: Prepare Revolution Slither remappings
        if: ${{ inputs.package_folder == 'packages/revolution' }}
        run: |
          mkdir -p "${{ inputs.package_folder }}/node_modules/@superfluid-finance"
          rm -rf "${{ inputs.package_folder }}/node_modules/@superfluid-finance/ethereum-contracts"
          ln -s "$GITHUB_WORKSPACE/lib/superfluid-protocol-monorepo/packages/ethereum-contracts" "${{ inputs.package_folder }}/node_modules/@superfluid-finance/ethereum-contracts"
          awk '{ if ($0 ~ /^@superfluid-finance\/ethereum-contracts=/) print "@superfluid-finance/ethereum-contracts/=node_modules/@superfluid-finance/ethereum-contracts/"; else print }' "${{ inputs.package_folder }}/remappings.txt" > "${{ inputs.package_folder }}/remappings.txt.tmp"
          mv "${{ inputs.package_folder }}/remappings.txt.tmp" "${{ inputs.package_folder }}/remappings.txt"

      - name: Run Slither
        run: |
          slither "${{ inputs.package_folder }}/src" \
            --checklist \
            --fail-high \
            --filter-paths "node_modules|@openzeppelin|@gnosis.pm|governance|grants|extensions|builder|culture-index/contests|ERC721|Votes|VotesUpgradeable|ERC1967Upgrade|SafeTransferLib.sol|ERC20Upgradeable.sol" \
            --config-file slither.config.json
